[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rss-mcp"
version = "0.1.0"
description = "MCP server that saves RSS/Atom feeds in SQLite and serves them over stdio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "rss", "atom", "sqlite", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "mcp>=2.3.0,<3",
  "feedparser>=6.0.11",
  "httpx>=0.27",
]

[project.scripts]
rss-mcp = "rss_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jimchrist-x/rss-mcp"
Repository = "https://github.com/jimchrist-x/rss-mcp"
Issues = "https://github.com/jimchrist-x/rss-mcp/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rss_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "SIM117"]
